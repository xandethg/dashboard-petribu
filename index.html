<!-- Importando o Firebase (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>

    <!-- SCRIPTS DE LÓGICA -->
    <script>
        // --- 1. CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "NUMERO",
            appId: "SEU_APP_ID"
        };

        // Inicializando o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // VARIAVEL GLOBAL DE MODO HISTÓRICO
        let isHistoryMode = false;

        // --- DATA E RELÓGIO ---
        function updateClock() {
            if(isHistoryMode) return; 
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('pt-BR');
            const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            const dateEl = document.getElementById('dash-date');
            const timeEl = document.getElementById('dash-time');
            
            if(dateEl && dateEl.innerText !== dateStr) dateEl.innerText = dateStr;
            if(timeEl && timeEl.innerText !== timeStr) timeEl.innerText = timeStr;
        }
        setInterval(updateClock, 1000);

        // --- TROCA DE TURNOS ---
        function changeShiftLayout(type) {
            const shift1 = document.querySelectorAll('.shift-1');
            const shift2 = document.querySelectorAll('.shift-2');
            const shift3 = document.querySelectorAll('.shift-3');
            
            if (type === 'seg-qui') {
                shift1.forEach(el => { el.style.display = ''; if(el.tagName === 'TH') el.innerText = '23h às 07h'; });
                shift2.forEach(el => { if(el.tagName === 'TH') el.innerText = '07h às 15h'; });
                shift3.forEach(el => { el.style.display = ''; if(el.tagName === 'TH') el.innerText = '15h às 23h'; });
            } else if (type === 'sex') {
                shift1.forEach(el => { el.style.display = ''; if(el.tagName === 'TH') el.innerText = '23h às 07h'; });
                shift2.forEach(el => { if(el.tagName === 'TH') el.innerText = '07h às 19h'; });
                shift3.forEach(el => { el.style.display = ''; if(el.tagName === 'TH') el.innerText = '19h às 07h'; });
            } else if (type === 'sab-dom') {
                shift1.forEach(el => { el.style.display = ''; if(el.tagName === 'TH') el.innerText = '07h às 19h'; });
                shift2.forEach(el => { if(el.tagName === 'TH') el.innerText = '19h às 07h'; });
                shift3.forEach(el => { el.style.display = 'none'; });
            }
            if(!isHistoryMode) localStorage.setItem('petribu_shift_type_v5', type); // Turno continua salvo localmente para conveniência
        }

        // --- INICIALIZAÇÃO E AUTO-SAVE NA NUVEM ---
        const STORAGE_KEY_TEMPLATE = 'petribu_dashboard_template_v5'; 
        
        document.addEventListener('DOMContentLoaded', async () => {
            updateClock();
            
            const mainContent = document.querySelector('.main-content');
            
            // Salva um molde zerado no armazenamento local do PC para a função "Limpar Painel"
            if (!localStorage.getItem(STORAGE_KEY_TEMPLATE)) {
                const clone = mainContent.cloneNode(true);
                localStorage.setItem(STORAGE_KEY_TEMPLATE, clone.innerHTML);
            }

            // Busca os dados temporários atuais da nuvem
            try {
                const docSnap = await db.collection('estado_atual').doc('dashboard_temporario').get();
                if (docSnap.exists) {
                    mainContent.innerHTML = docSnap.data().html;
                    updateClock(); 
                }
            } catch(error) {
                console.log("Iniciando com painel em branco. (Erro ou primeiro acesso)", error);
            }

            const savedShift = localStorage.getItem('petribu_shift_type_v5');
            if (savedShift) {
                const selector = document.getElementById('shift-selector');
                if(selector) {
                    selector.value = savedShift;
                    changeShiftLayout(savedShift);
                }
            }

            // Observer para salvar automaticamente na NUVEM enquanto você preenche
            let saveTimeout;
            const observer = new MutationObserver((mutations) => {
                if(isHistoryMode) return; 
                
                let shouldSave = false;
                for(let m of mutations) {
                    if (m.target.id !== 'dash-time' && m.target.id !== 'dash-date') {
                        shouldSave = true;
                        break;
                    }
                }
                
                if (shouldSave) {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        db.collection('estado_atual').doc('dashboard_temporario').set({
                            html: mainContent.innerHTML,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }).catch(err => console.error("Erro no auto-save:", err));
                    }, 1500); // Salva 1.5s após você parar de digitar
                }
            });
            observer.observe(mainContent, { attributes: true, childList: true, subtree: true, characterData: true });
        });

        async function clearDashboard() {
            if(isHistoryMode) {
                alert("Você está visualizando o histórico. Volte para o dia atual para limpar o painel.");
                return;
            }
            if (confirm("Tem certeza que deseja APAGAR TODOS OS DADOS e começar um relatório em branco para todos os computadores?")) {
                const template = localStorage.getItem(STORAGE_KEY_TEMPLATE);
                if (template) {
                    document.querySelector('.main-content').innerHTML = template;
                    
                    // Limpa também na nuvem
                    await db.collection('estado_atual').doc('dashboard_temporario').set({
                        html: template,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    const selector = document.getElementById('shift-selector');
                    if(selector) {
                        selector.value = 'seg-qui';
                        changeShiftLayout('seg-qui');
                    }
                    updateClock();
                } else {
                    location.reload();
                }
            }
        }

        // --- LÓGICA DE HISTÓRICO DA SAFRA (NUVEM) ---
        async function saveDay() {
            if(isHistoryMode) {
                alert("Atenção: Você já está visualizando um relatório salvo no histórico!");
                return;
            }
            
            let dateStr = document.getElementById('dash-date').innerText.trim();
            if(!dateStr || dateStr === '--/--/----') {
                alert("Erro: A data não está preenchida corretamente.");
                return;
            }
            
            let confirmSave = confirm(`Você quer salvar o relatório atual como o registro oficial do dia ${dateStr} na nuvem?`);
            if(confirmSave) {
                let currentHTML = document.querySelector('.main-content').innerHTML;
                let docId = dateStr.replaceAll('/', '-'); // Firebase não aceita barras no ID
                
                try {
                    await db.collection('historico_safra').doc(docId).set({
                        html: currentHTML,
                        dataOriginal: dateStr,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert(`✅ O relatório do dia ${dateStr} foi salvo com sucesso no banco de dados!`);
                } catch(error) {
                    console.error("Erro ao salvar:", error);
                    alert("Erro ao salvar. Verifique se o Firebase está configurado corretamente.");
                }
            }
        }

        async function openHistoryModal() {
            let listEl = document.getElementById('history-list');
            listEl.innerHTML = '<li style="padding:15px; text-align:center;">Buscando dados na nuvem... ⏳</li>';
            document.getElementById('history-modal').style.display = 'flex';
            
            try {
                const snapshot = await db.collection('historico_safra').orderBy('timestamp', 'desc').get();
                listEl.innerHTML = '';
                
                if(snapshot.empty) {
                    listEl.innerHTML = '<li style="padding:15px; color:#64748b; text-align:center; font-style:italic;">Nenhum relatório salvo no banco de dados.</li>';
                    return;
                }

                snapshot.forEach(doc => {
                    let d = doc.data().dataOriginal;
                    let docId = doc.id;
                    let li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `
                        <span class="history-item-date" onclick="loadHistory('${docId}', '${d}')">📄 Relatório de ${d}</span>
                        <button onclick="deleteHistory('${docId}', '${d}')" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:16px;" title="Apagar Dia">🗑️</button>
                    `;
                    listEl.appendChild(li);
                });
            } catch (error) {
                listEl.innerHTML = '<li style="padding:15px; color:#ef4444; text-align:center;">Erro ao buscar histórico. As regras do Firebase estão liberadas?</li>';
                console.error(error);
            }
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').style.display = 'none';
        }

        async function deleteHistory(docId, dateStr) {
            if(confirm(`Tem certeza que quer apagar DEFINITIVAMENTE o relatório arquivado do dia ${dateStr} da nuvem?`)) {
                try {
                    await db.collection('historico_safra').doc(docId).delete();
                    openHistoryModal(); // Atualiza a lista automaticamente
                } catch (error) {
                    alert("Erro ao excluir relatório.");
                    console.error(error);
                }
            }
        }

        async function loadHistory(docId, dateStr) {
            let confirmLoad = confirm(`Carregar o histórico do dia ${dateStr}? Isso vai pausar a sua tela atual de preenchimento.`);
            if(!confirmLoad) return;
            
            try {
                const docSnap = await db.collection('historico_safra').doc(docId).get();
                if (docSnap.exists) {
                    document.querySelector('.main-content').innerHTML = docSnap.data().html;
                    isHistoryMode = true;
                    closeHistoryModal();
                    
                    let shiftSelector = document.getElementById('shift-selector');
                    if(shiftSelector) shiftSelector.disabled = true;
                    
                    let banner = document.createElement('div');
                    banner.className = 'no-print';
                    banner.style = 'background: #f59e0b; color: white; padding: 12px 20px; display:flex; justify-content:space-between; align-items:center; font-weight: bold; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #b45309;';
                    banner.innerHTML = `
                        <span style="font-size:16px;">⚠️ MODO DE LEITURA: Visualizando arquivo do dia ${dateStr}</span> 
                        <button onclick="exitHistoryMode()" style="background:white; color:#b45309; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; box-shadow:0 1px 2px rgba(0,0,0,0.1);">Voltar para o Painel de Hoje ➔</button>
                    `;
                    document.querySelector('.main-content').prepend(banner);
                }
            } catch(error) {
                alert("Erro ao carregar o relatório da nuvem.");
                console.error(error);
            }
        }

        function exitHistoryMode() {
            location.reload();
        }

        // --- BADGES ---
        const stateConfig = {
            'tarefa': [
                { text: 'Concluído', class: 'badge-concluido' },
                { text: 'Em andamento', class: 'badge-andamento' },
                { text: 'Pendente', class: 'badge-parada' }
            ],
            'operacao': [
                { text: 'Normal', class: 'badge-normal' },
                { text: 'Operando', class: 'badge-normal' },
                { text: 'Vazio', class: 'badge-andamento' },
                { text: 'Parada', class: 'badge-parada' },
                { text: 'Disponível', class: 'badge-normal' }
            ],
            'operacaoGlobal': [
                { text: 'OPERAÇÃO NORMAL', class: 'badge-normal' },
                { text: 'OPERAÇÃO PARCIAL', class: 'badge-andamento' },
                { text: 'SAFRA PARADA', class: 'badge-parada' }
            ],
            'expStatus': [
                { text: '-', class: 'badge-inativo' },
                { text: 'Ativo', class: 'badge-concluido' }
            ]
        };

        function cycleStatus(element, type) {
            let states = stateConfig[type];
            let currentText = element.innerText.trim();
            let currentIndex = states.findIndex(s => s.text === currentText);
            if (currentIndex === -1) currentIndex = 0; 

            let nextIndex = (currentIndex + 1) % states.length;
            let nextState = states[nextIndex];

            let extraClass = element.classList.contains('badge-inline') ? ' badge-inline' : '';
            element.className = 'badge ' + nextState.class + extraClass;
            element.innerText = nextState.text;

            if (type === 'operacaoGlobal') {
                let emojiEl = document.querySelector('.status-emoji');
                if (nextState.class === 'badge-normal') emojiEl.innerText = '🟢';
                else if (nextState.class === 'badge-andamento') emojiEl.innerText = '🟡';
                else emojiEl.innerText = '🔴';
            }
        }

        function addCheckItem(containerId) {
            let container = document.getElementById(containerId);
            let div = document.createElement('div');
            div.className = 'check-item';
            div.innerHTML = `
                <span contenteditable="true">☑️ Nova tarefa (clique para editar)...</span>
                <div>
                    <span class="badge badge-parada badge-inline" onclick="cycleStatus(this, 'tarefa')">Pendente</span>
                    <button class="btn-remove" onclick="this.parentElement.parentElement.remove()">✖</button>
                </div>
            `;
            container.appendChild(div);
        }

        function addStatusItem(containerId) {
            let container = document.getElementById(containerId);
            let div = document.createElement('div');
            div.className = 'status-item';
            div.innerHTML = `
                <span class="status-name" contenteditable="true">🏢 Novo Equipamento/Área</span>
                <div class="status-badge-container">
                    <span class="badge badge-normal" onclick="cycleStatus(this, 'operacao')">Normal</span>
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        }

        function addSimpleItem(containerId) {
            let container = document.getElementById(containerId);
            let li = document.createElement('li');
            li.innerHTML = `
                <span contenteditable="true">Escreva aqui...</span>
                <button class="btn-remove" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(li);
        }

        function addRecebimentoTerceiros() {
            let container = document.getElementById('informativo-container');
            let div = document.createElement('div');
            div.className = 'info-box';
            div.innerHTML = `
                <div class="info-title" style="justify-content: space-between;">
                    <span contenteditable="true">🚛 USINA ESTIVAS - BIG BAG</span>
                    <button class="btn-remove" onclick="this.parentElement.parentElement.remove()" style="opacity:1;">✖ Remover</button>
                </div>
                <div class="flex-row">
                    <div class="flex-col">
                        <strong>Ontem</strong>
                        <ul class="simple-list"><li><span contenteditable="true">0 Veículos – 0t</span></li></ul>
                    </div>
                    <div class="flex-col">
                        <strong>Hoje</strong>
                        <ul class="simple-list"><li><span contenteditable="true">0 Veículos – 0t</span></li></ul>
                    </div>
                </div>
                <div style="margin-top: 8px; font-weight: bold; border-top: 1px dashed #cbd5e1; padding-top: 5px;">
                    Total acumulado: <span contenteditable="true" style="color:var(--primary-blue);">0t</span>
                </div>
            `;
            let insertBeforeTarget = document.getElementById('row-ausentes-paradas');
            container.insertBefore(div, insertBeforeTarget);
        }
    </script>
